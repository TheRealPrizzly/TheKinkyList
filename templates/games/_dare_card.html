{% load art %}
<article class="item-card flip-in" data-kind="dare" data-key="{{ item.id }}" data-recycled="{{ recycled|yesno:'1,' }}"{% if wish %} data-details tabindex="0"{% endif %} x-init="show($el)">
  <div class="art-wrap">{% item_art item %}<span class="status-badge kind-badge">Dare</span></div>
  {% include "partials/item_body.html" %}
  {% if wish %}
    <p class="details-cue"><span class="tip-hover">Hover for the details</span><span class="tip-touch">Tap for the details</span></p>
    {% include "games/_item_details.html" %}
  {% endif %}
</article>
