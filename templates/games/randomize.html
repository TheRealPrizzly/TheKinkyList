{% extends "games/base_game.html" %}
{% block game %}
<div id="cards" class="draw-grid">
  {% if item %}{% include "games/_randomize_card.html" %}{% endif %}
</div>
<p class="muted" x-show="exhausted" x-cloak style="text-align:center; margin-top:20px">That's everything available. Add more wishes to keep going.</p>
<p class="muted" x-show="full" x-cloak style="text-align:center; margin-top:20px">That's the most you can draw at once.</p>
<div class="stage-controls">
  <button class="btn" type="button" @click="oneMore()" :disabled="full || exhausted || loading">
    <span x-show="!loading">✦ One more</span>
    <span x-show="loading" x-cloak class="loading-dots"><i></i><i></i><i></i></span>
  </button>
</div>
{% endblock %}
