# Builds the iPhone app on one of GitHub's Macs, then starts it in an iPhone simulator to check that
# it opens. No Apple account is involved yet: the iPhone build is unsigned, so it can't be installed.
# Runs whenever something in mobile/ changes, or from the Actions tab (Run workflow).

name: iPhone app

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install Capacitor
        run: npm ci

      # Writes the site address, the plugins and the Swift package list into the iPhone project.
      # SITE_URL is unset, so the app opens the live site.
      - name: Sync the iPhone project
        run: |
          npx cap sync ios | tee "$RUNNER_TEMP/sync.log"
          echo "::notice::Plugins: $(grep -oE '@capacitor[^ ]*@[0-9.]+' "$RUNNER_TEMP/sync.log" | sort -u | tr '\n' ' ')"

      - name: Show the Xcode version
        run: xcodebuild -version

      # The build TestFlight will need, minus the signing.
      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/device" \
            CODE_SIGNING_ALLOWED=NO build | xcbeautify --renderer github-actions

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/simulator" \
            CODE_SIGNING_ALLOWED=NO build | xcbeautify --renderer github-actions

      # Opens the app on a simulated iPhone, waits for the site to load, takes a screenshot and
      # checks the app is still running. If it isn't, its last log lines show up as errors.
      - name: Open the app in the simulator
        run: |
          results="$RUNNER_TEMP/results"
          mkdir -p "$results"
          device=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          echo "::notice::Simulator: $(xcrun simctl list devices | grep "$device" | sed 's/^ *//')"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b > /dev/null
          xcrun simctl install "$device" "$RUNNER_TEMP/simulator/Build/Products/Debug-iphonesimulator/App.app"
          pid=$(xcrun simctl launch --stdout="$results/stdout.log" --stderr="$results/stderr.log" \
            "$device" com.thekinkylist.app | awk '{print $NF}')
          sleep 30
          xcrun simctl io "$device" screenshot "$results/screenshot.png" || true
          xcrun simctl spawn "$device" log show --last 5m --style compact \
            --predicate 'process == "App"' > "$results/system.log" || true
          if ps -p "$pid" > /dev/null; then
            echo "::notice::The app is still running 30 seconds after opening."
          else
            echo "::error::The app closed or crashed within 30 seconds of opening."
            cat "$results/stdout.log" "$results/stderr.log" "$results/system.log" 2>/dev/null \
              | grep -iE "terminating|exception|fatal|error" | tail -n 8 \
              | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          fi

      # GitHub only shows full logs to the repository's admins, so the useful lines become notes on
      # the run: what the app printed while starting, and the text on its screen.
      - name: Report what the app shows
        if: always()
        run: |
          results="$RUNNER_TEMP/results"
          for log in stdout stderr system; do
            echo "$log.log: $(wc -l < "$results/$log.log" 2>/dev/null || echo missing) lines"
          done
          cat "$results/stdout.log" "$results/stderr.log" "$results/system.log" 2>/dev/null \
            | grep -E "⚡️|Loading app|WebView|Firebase|rror" | grep -v IOService | head -n 8 \
            | while IFS= read -r line; do echo "::notice::App: ${line:0:900}"; done
          if [ -f "$results/screenshot.png" ]; then
            cat > "$RUNNER_TEMP/read_text.swift" <<'SWIFT'
          import Foundation
          import Vision
          let request = VNRecognizeTextRequest()
          try VNImageRequestHandler(url: URL(fileURLWithPath: CommandLine.arguments[1])).perform([request])
          print((request.results ?? []).compactMap { $0.topCandidates(1).first?.string }.joined(separator: " | "))
          SWIFT
            echo "::notice::Screen: $(swift "$RUNNER_TEMP/read_text.swift" "$results/screenshot.png" 2>/dev/null | tr '\n' ' ' | head -c 900)"
          fi

      - name: Keep the screenshot and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-results
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
